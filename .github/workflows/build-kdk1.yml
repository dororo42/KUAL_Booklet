name: Build KDK1 (K4/K5 legacy) azw2

# Builds the Kindlet (KDK 1.0) variant from source without Amazon's
# copyrighted Kindlet-1.*.jar: the small Amazon API surface used by the
# KDK1 classes is provided by generated compile-time stubs (never shipped).
# The resulting azw2 is signed with the repository's developer.keystore,
# whose three certs match the MKK trust chain (see patches/README.md).

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8 (required for -source/-target 1.4)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Generate Amazon API stub jar (compile-time only)
        run: |
          mkdir -p ci-stub/src/com/amazon/kindle/{kindlet/event,booklet}
          cat > ci-stub/src/com/amazon/kindle/booklet/BookletContext.java <<'EOF'
          package com.amazon.kindle.booklet;
          public interface BookletContext { }
          EOF
          cat > ci-stub/src/com/amazon/kindle/kindlet/KindletContext.java <<'EOF'
          package com.amazon.kindle.kindlet;
          import com.amazon.kindle.booklet.BookletContext;
          public interface KindletContext extends BookletContext {
              java.awt.Container getRootContainer();
          }
          EOF
          cat > ci-stub/src/com/amazon/kindle/kindlet/AbstractKindlet.java <<'EOF'
          package com.amazon.kindle.kindlet;
          public abstract class AbstractKindlet { }
          EOF
          cat > ci-stub/src/com/amazon/kindle/kindlet/event/KindleKeyCodes.java <<'EOF'
          package com.amazon.kindle.kindlet.event;
          public interface KindleKeyCodes {
              int VK_RIGHT_HAND_SIDE_TURN_PAGE = 61448;
              int VK_LEFT_HAND_SIDE_TURN_PAGE = 61449;
              int VK_TURN_PAGE_BACK = 61450;
              int VK_LEFT_HAND_SIDE_TURN_PAGE_BACK = 61452;
              int VK_TEXT = 61441;
              int VK_MENU = 61442;
              int VK_BACK = 61451;
              int VK_HOME = 61441;
          }
          EOF
          mkdir -p ci-stub/classes ci-stub/out
          javac -d ci-stub/classes $(find ci-stub/src -name '*.java')
          jar cf ci-stub/kindlet-stub.jar -C ci-stub/classes .

      - name: Compile KDK1 classes (Java 1.4 bytecode)
        run: |
          mkdir -p ci-stub/out
          # Excludes the Booklet variant; jailbreak.jar ships in lib/.
          find src/com/mobileread/ixtab/kindlelauncher -name '*.java' \
               ! -name 'KualBooklet.java' -print0 \
            | xargs -0 javac -source 1.4 -target 1.4 -Xlint:-options \
                -d ci-stub/out \
                -cp ci-stub/kindlet-stub.jar:lib/jailbreak.jar
          # Prove every class is major 48 (Java 1.4), as KDK 1.0 requires.
          python3 - <<'PY'
          import glob, struct
          majors = {}
          for p in glob.glob('ci-stub/out/**/*.class', recursive=True):
              m = struct.unpack('>H', open(p,'rb').read(8)[6:8])[0]
              majors[m] = majors.get(m, 0) + 1
          print('bytecode majors:', majors)
          assert set(majors) == {48}, 'KDK 1.0 requires Java 1.4 (major 48)'
          assert majors[48] >= 25, 'unexpectedly few compiled classes'
          PY

      - name: Generate parse.awk (version injection + comment strip)
        run: |
          RES=src/com/mobileread/ixtab/kindlelauncher/resources
          REV=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y%m%d)
          # parse-commented.awk itself carries the @repository.version@ /
          # @repository.date@ placeholders (ant copies it to a .tpl backup
          # before injecting). Substitute from it directly.
          sed -e "s/@repository.version@/${REV}/" \
              -e "s/@repository.date@/${DATE}/" \
              "$RES/parse-commented.awk" > /tmp/parse-injected.awk
          cp /tmp/parse-injected.awk "$RES/parse-commented.awk"
          bash "$RES/tool/stripit.sh" >/dev/null
          test -s "$RES/parse.awk"
          grep -m1 'VERSION=' "$RES/parse.awk"

      - name: Assemble azw2 (manifest + classes + parse.awk + cover)
        run: |
          mkdir -p ci-stub/stage/com/mobileread/ixtab/kindlelauncher
          cp -r ci-stub/out/* ci-stub/stage/
          cp -r src/com/mobileread/ixtab/kindlelauncher/resources ci-stub/stage/com/mobileread/ixtab/kindlelauncher/
          rm -rf ci-stub/stage/com/mobileread/ixtab/kindlelauncher/resources/{old,aloop,booklet,tool,dist}
          rm -f ci-stub/stage/com/mobileread/ixtab/kindlelauncher/resources/parse-commented.awk*
          cp KindleLauncher.jpg ci-stub/stage/
          cat > ci-stub/MANIFEST.MF <<'EOF'
          Manifest-Version: 1.0
          SDK-Specification-Version: 1.0
          Implementation-Title: KUAL
          Implementation-Version: 2.7
          Implementation-Vendor: ixtab NiLuJe twobob stepk
          Main-Class: com.mobileread.ixtab.kindlelauncher.KualKindlet
          Amazon-Cover-Image: KindleLauncher.jpg
          Toolbar-Mode: persistent
          Font-Size-Mode: point
          Extension-List: SDK
          SDK-Extension-Name: com.amazon.kindle.kindlet

          EOF
          jar cfm KUAL-KDK-1.0-custom.azw2 ci-stub/MANIFEST.MF -C ci-stub/stage .

      - name: Sign with the three MKK-trusted test certificates
        run: |
          for a in dktest ditest dntest; do
            jarsigner -keystore developer.keystore -storepass password \
              -sigalg SHA256withRSA -digestalg SHA-256 \
              KUAL-KDK-1.0-custom.azw2 "$a"
          done
          jarsigner -verify -verbose -certs KUAL-KDK-1.0-custom.azw2 | tail -5
          unzip -l KUAL-KDK-1.0-custom.azw2 | tail -3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KUAL-KDK-1.0-custom
          path: KUAL-KDK-1.0-custom.azw2
