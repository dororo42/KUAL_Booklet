name: Build KDK1 (K4/K4B legacy) azw2

# Builds the Kindlet (KDK 1.0) variant from the OFFICIAL v2.7 decompiled
# sources (kdk1/src, see kdk1/README.md) — NOT from the Booklet-ized src/ at
# the repo root, which is incompatible with the KDK-1.0 Kindlet framework
# (BookletContext vs KindletContext, java.util.Timer vs kindlet Timer).
# Amazon API stubs (kdk1/stub-src) are compile-time only and never shipped.
# Signed with developer.keystore whose three certs match the MKK trust chain.

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8 (required for -source/-target 1.4 => major 48)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Compile Amazon API stubs (compile-time only, never shipped)
        run: |
          mkdir -p kdk1/stub-classes kdk1/stub-out
          javac -d kdk1/stub-classes $(find kdk1/stub-src -name '*.java')
          jar cf kdk1/kindlet-stub-full.jar -C kdk1/stub-classes .

      - name: Compile KDK1 classes (Java 1.4 bytecode, -g like the official build)
        run: |
          find kdk1/src -name '*.java' -print0 \
            | xargs -0 javac -source 1.4 -target 1.4 \
                -g:lines,vars,source -Xlint:-options \
                -d kdk1/stub-out \
                -cp kdk1/kindlet-stub-full.jar:lib/jailbreak.jar
          python3 - <<'PY'
          import glob, struct
          majors = {}
          for p in glob.glob('kdk1/stub-out/**/*.class', recursive=True):
              m = struct.unpack('>H', open(p,'rb').read(8)[6:8])[0]
              majors[m] = majors.get(m, 0) + 1
          print('compiled bytecode majors:', majors)
          assert set(majors) == {48}, 'KDK 1.0 requires Java 1.4 (major 48)'
          PY

      - name: Assemble azw2 (classes + jailbreak + official parse.awk + cover)
        run: |
          mkdir -p kdk1/stage/com/mobileread/ixtab/kindlelauncher
          cp -r kdk1/stub-out/* kdk1/stage/
          unzip -oq lib/jailbreak.jar -x 'META-INF/*' -d kdk1/stage
          find kdk1/stage -name '*.java' -delete
          mkdir -p kdk1/stage/com/mobileread/ixtab/kindlelauncher/resources
          cp kdk1/resources/parse.awk kdk1/stage/com/mobileread/ixtab/kindlelauncher/resources/parse.awk
          cp KindleLauncher.jpg kdk1/stage/
          cat > kdk1/MANIFEST.MF <<'EOF'
          Manifest-Version: 1.0
          SDK-Specification-Version: 1.0
          Implementation-Title: KUAL-custom
          Implementation-Version: 2.7
          Implementation-Vendor: ixtab NiLuJe twobob stepk
          Main-Class: com.mobileread.ixtab.kindlelauncher.KualKindlet
          Amazon-Cover-Image: KindleLauncher.jpg
          Toolbar-Mode: persistent
          Font-Size-Mode: point
          Extension-List: SDK
          SDK-Extension-Name: com.amazon.kindle.kindlet

          EOF
          jar cfm KUAL-KDK-1.0-custom.azw2 kdk1/MANIFEST.MF -C kdk1/stage .

      - name: Sign with the three MKK-trusted test certificates
        run: |
          for a in dktest ditest dntest; do
            jarsigner -keystore developer.keystore -storepass password \
              -sigalg SHA256withRSA -digestalg SHA-256 \
              KUAL-KDK-1.0-custom.azw2 "$a"
          done
          jarsigner -verify -strict KUAL-KDK-1.0-custom.azw2 | grep -E "jar verified" || true

      - name: Assert KDK-1.0 ABI parity with official v2.7
        run: |
          python3 - <<'PY'
          import hashlib, struct, zipfile

          # sha256 of the official v2.7 parse.awk shipped in kdk1/resources
          OFFICIAL_PARSE_AWK_SHA256 = "829c0209ec9f91b9a8dae799d7c97d8507dbee0647f520b3bd89701f81a493d0"


          def check(path):
              z = zipfile.ZipFile(path)
              names = z.namelist()
              cs = [n for n in names if n.endswith('.class')]
              rsa = [n for n in names if n.endswith('.RSA')]
              print("%s: %d entries, %d classes, %d signatures" % (path, len(names), len(cs), len(rsa)))

              problems = []

              def ok(label, cond, detail=""):
                  print(("PASS " if cond else "FAIL ") + label + ((" :: " + detail) if detail else ""))
                  if not cond:
                      problems.append(label + ((" :: " + detail) if detail else ""))

              ok("entry inventory equals official v2.7 (58)", len(names) == 58, str(len(names)))
              ok("class inventory equals official v2.7 (37)", len(cs) == 37, str(len(cs)))
              ok("every class is Java 1.4 (major 48)",
                 {struct.unpack('>H', z.read(n)[6:8])[0] for n in cs} == {48})
              stray = [n for n in names if n.endswith('.java')]
              ok("no stray .java sources from jailbreak.jar", not stray, ",".join(stray))
              blob = b"".join(z.read(n) for n in cs)
              ok("no Booklet API (com/amazon/kindle/booklet) in classes",
                 b"com/amazon/kindle/booklet" not in blob)
              kta = "com/mobileread/ixtab/kindlelauncher/timer/KTimerAdapter.class"
              ok("KTimerAdapter uses com.amazon.kindle.kindlet.util.Timer",
                 b"com/amazon/kindle/kindlet/util/Timer" in z.read(kta))
              ok("7 ixtab/jailbreak classes bundled",
                 len([n for n in cs if n.startswith("ixtab/jailbreak/")]) == 7)
              paw = "com/mobileread/ixtab/kindlelauncher/resources/parse.awk"
              ok("parse.awk byte-identical to official v2.7",
                 hashlib.sha256(z.read(paw)).hexdigest() == OFFICIAL_PARSE_AWK_SHA256)
              ok("three developer signatures present", len(rsa) == 3, ",".join(rsa))
              assert not problems, "%d ABI gate failure(s): %s" % (len(problems), " | ".join(problems))
              print("ABI GATE PASS: " + path)


          check('KUAL-KDK-1.0-custom.azw2')
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KUAL-KDK-1.0-custom
          path: KUAL-KDK-1.0-custom.azw2
