# KUAL.cfg — K4 (0E/Tequila) + 黑色 K5 = Kindle 5th Gen/K4B (23/Sauza) 调优配置 (Z-2)
# 两台同为 FW 4.1.4 / KDK 1.0 / Yoshi，同用 KUAL-KDK-1.0.azw2 → 同一份配置、同一路径。
# 安装位置: /mnt/us/extensions/KUAL.cfg（两台一字不差）
# 注意: KUAL 首次运行会自动创建该文件(缺省模板)；本文件为预调优版，直接覆盖即可。
# 所有键均为审查报告 Z-2 所列，键名/取值语义已按 KualKindlet.java 反编译源逐项核实。

# ---- 每页菜单项数 ----
# 缺省: K4 (KUIAdapter) = 5 (getDefaultPageSize, KualKindlet.java:507 缺省回退)。
# K4 屏幕小、按钮需指尖触达，5 是官方为 K4 定的值，保留。
page_size=5

# ---- 字体 ----
# 缺省 Futura + Regular (KualKindlet.java:257-262)。
# 可选 style: Regular / Bold / Italic / BoldItalic
font_family=Futura
font_style=Regular

# ---- 状态栏 ----
# true = 隐藏底部状态栏，菜单区多一行空间
no_show_status=true

# ---- 排序 ----
# ABC = 按名字字典序(稳定可预期)；mru = 最近使用优先(常用项上浮)
sort_mode=ABC

# ---- 扫描 ----
# find 最大深度；扩展标准布局 extensions/<name>/config.xml 深度=2，够用
search_depth=2
# 跳过符号链接(避免 /mnt/us 内软链导致重复扫描)
nofollow=true
# 排除目录(多个用分号分隔)；system 目录保持缺省排除
# search_exclude_paths=system
